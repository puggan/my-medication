# Medication stock web app: Node on 127.0.0.1:3100 (med-web.service), TLS terminated here
<VirtualHost *:443>
    ServerName med.sundragon.se

    ProxyPreserveHost on
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/med.sundragon.se/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/med.sundragon.se/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog  ${APACHE_LOG_DIR}/med-error.log
    CustomLog ${APACHE_LOG_DIR}/med-access.log combined
    # HSTS: start at 1 day, raise to 31536000 once verified
    Header always set Strict-Transport-Security "max-age=86400"
</VirtualHost>

<VirtualHost *:80>
    ServerName med.sundragon.se
    RedirectMatch 301 ^(?!/\.well-known/acme-challenge/)(.*) https://med.sundragon.se$1

    ErrorLog  ${APACHE_LOG_DIR}/med-error.log
    CustomLog ${APACHE_LOG_DIR}/med-access.log combined
</VirtualHost>
